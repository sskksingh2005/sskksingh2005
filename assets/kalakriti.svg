<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Kalakriti+ - AI-driven market-linkage platform for artisans">
<title>Kalakriti+ - AI-driven market-linkage platform for artisans</title>
<defs>
  <linearGradient id="Cb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#0d1b3d"/></linearGradient>
  <linearGradient id="Ct" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <radialGradient id="Chalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
  .name{font-size:30px;font-weight:800;fill:url(#Ct)}
  .desc{font-size:16px;fill:#c9d1d9}
  .chip{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:12px;fill:#e6edf3}
  .num{font-size:64px;font-weight:800;fill:#fff;fill-opacity:.06}
  .cta{font-size:14px;font-weight:600;fill:#f59e0b}
  .sweep{fill:none;stroke:url(#Ct);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:70 930;animation:sw 6s linear infinite}
  @keyframes sw{to{stroke-dashoffset:-1000}}
  .arrow{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  
  .a{animation:wa 3s ease-in-out infinite}.b{animation:wa 3s ease-in-out 1.5s infinite}
  @keyframes wa{0%,100%{opacity:.25}50%{opacity:.75}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
  @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
  .road{animation:rd 1.2s linear infinite}@keyframes rd{to{stroke-dashoffset:-11}}
  .ping{transform-box:fill-box;transform-origin:center;animation:pg 2s ease-out infinite}
  @keyframes pg{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .blink{transform-box:fill-box;transform-origin:center;animation:bk 5s infinite}
  @keyframes bk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
  .spinr{transform-box:fill-box;transform-origin:center;animation:sp 20s linear infinite reverse}
  @keyframes sp{to{transform:rotate(360deg)}}
  .brk{transform-box:fill-box;transform-origin:center;animation:bb 2.6s ease-in-out infinite}
  @keyframes bb{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="898" height="148" rx="20" fill="url(#Cb)"/>
<circle cx="75" cy="75" r="95" fill="url(#Chalo)"/>
<rect x="1" y="1" width="898" height="148" rx="20" fill="none" stroke="#f59e0b" stroke-opacity=".3" stroke-width="1.5"/>
<rect class="sweep" x="1" y="1" width="898" height="148" rx="20" pathLength="1000"/>
<g transform="translate(20 20) scale(.9167)"><defs>
    <linearGradient id="Cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="Cglow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <clipPath id="Cclip"><rect x="6" y="6" width="108" height="108" rx="24"/></clipPath>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0a1128"/>
  <rect width="120" height="120" rx="28" fill="url(#Cglow)"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="url(#Cg)" stroke-opacity=".65" stroke-width="2"/>
  <g clip-path="url(#Cclip)" fill="none" stroke="url(#Cg)" stroke-width="1.6">
      <g class="a" opacity=".55"><path d="M0 -96L120 24"/><path d="M0 -72L120 48"/><path d="M0 -48L120 72"/><path d="M0 -24L120 96"/><path d="M0 0L120 120"/><path d="M0 24L120 144"/><path d="M0 48L120 168"/><path d="M0 72L120 192"/><path d="M0 96L120 216"/><path d="M0 120L120 240"/></g><g class="b" opacity=".55"><path d="M0 24L120 -96"/><path d="M0 48L120 -72"/><path d="M0 72L120 -48"/><path d="M0 96L120 -24"/><path d="M0 120L120 0"/><path d="M0 144L120 24"/><path d="M0 168L120 48"/><path d="M0 192L120 72"/><path d="M0 216L120 96"/><path d="M0 240L120 120"/></g></g>
      <circle cx="60" cy="60" r="23" fill="#0a1128" stroke="url(#Cg)" stroke-width="3"/>
      <path class="pulse" d="M60 47v26M47 60h26" stroke="url(#Cg)" stroke-width="6" stroke-linecap="round" fill="none"/></g>
<text x="160" y="56" class="name">Kalakriti+</text>
<text x="160" y="84" class="desc">AI-driven market-linkage platform for artisans</text>
<g><rect x="160" y="100" width="61" height="24" rx="12" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/>
      <text x="190.5" y="116" text-anchor="middle" class="chip">React</text></g><g><rect x="229" y="100" width="76" height="24" rx="12" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/>
      <text x="267" y="116" text-anchor="middle" class="chip">FastAPI</text></g><g><rect x="313" y="100" width="98" height="24" rx="12" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".4"/>
      <text x="362" y="116" text-anchor="middle" class="chip">PostgreSQL</text></g>
<text x="870" y="78" text-anchor="end" class="num">01</text>
<text x="870" y="124" text-anchor="end" class="cta">View project <tspan class="arrow">→</tspan></text>
</svg>
