<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 120 120" role="img" aria-label="Kalakriti+ logo"><style>
  .a{animation:wa 3s ease-in-out infinite}.b{animation:wa 3s ease-in-out 1.5s infinite}
  @keyframes wa{0%,100%{opacity:.25}50%{opacity:.75}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
  @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
  .road{animation:rd 1.2s linear infinite}@keyframes rd{to{stroke-dashoffset:-11}}
  .ping{transform-box:fill-box;transform-origin:center;animation:pg 2s ease-out infinite}
  @keyframes pg{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .blink{transform-box:fill-box;transform-origin:center;animation:bk 5s infinite}
  @keyframes bk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  .spin{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
  .spinr{transform-box:fill-box;transform-origin:center;animation:sp 20s linear infinite reverse}
  @keyframes sp{to{transform:rotate(360deg)}}
  .brk{transform-box:fill-box;transform-origin:center;animation:bb 2.6s ease-in-out infinite}
  @keyframes bb{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs>
    <linearGradient id="Lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="Lglow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#f59e0b" stop-opacity=".35"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <clipPath id="Lclip"><rect x="6" y="6" width="108" height="108" rx="24"/></clipPath>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0a1128"/>
  <rect width="120" height="120" rx="28" fill="url(#Lglow)"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="url(#Lg)" stroke-opacity=".65" stroke-width="2"/>
  <g clip-path="url(#Lclip)" fill="none" stroke="url(#Lg)" stroke-width="1.6">
      <g class="a" opacity=".55"><path d="M0 -96L120 24"/><path d="M0 -72L120 48"/><path d="M0 -48L120 72"/><path d="M0 -24L120 96"/><path d="M0 0L120 120"/><path d="M0 24L120 144"/><path d="M0 48L120 168"/><path d="M0 72L120 192"/><path d="M0 96L120 216"/><path d="M0 120L120 240"/></g><g class="b" opacity=".55"><path d="M0 24L120 -96"/><path d="M0 48L120 -72"/><path d="M0 72L120 -48"/><path d="M0 96L120 -24"/><path d="M0 120L120 0"/><path d="M0 144L120 24"/><path d="M0 168L120 48"/><path d="M0 192L120 72"/><path d="M0 216L120 96"/><path d="M0 240L120 120"/></g></g>
      <circle cx="60" cy="60" r="23" fill="#0a1128" stroke="url(#Lg)" stroke-width="3"/>
      <path class="pulse" d="M60 47v26M47 60h26" stroke="url(#Lg)" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
