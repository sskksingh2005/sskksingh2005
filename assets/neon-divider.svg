    </filter>
  </defs>
  <path d="M20 14H1180" stroke="url(#neon)" stroke-width="5" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <path d="M20 14H1180" stroke="url(#neon)" stroke-width="1.5" stroke-linecap="round"/>
