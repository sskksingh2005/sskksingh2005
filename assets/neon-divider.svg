<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Neon gradient divider">
  <defs>
    <linearGradient id="neon" x1="20" y1="14" x2="1180" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.34" stop-color="#3B82F6"/>
      <stop offset="0.68" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
